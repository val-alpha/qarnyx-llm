[workspace]
resolver = "3"
members = [
    "crates/qarnyx-core",
    "crates/qarnyx-gguf",
    "crates/qarnyx-quant",
    "crates/qarnyx-cpu",
    "crates/qarnyx-tokenizer",
    "crates/qarnyx-models",
    "crates/qarnyx-runtime",
    "crates/qarnyx-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
thiserror = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
