name: CI

on:
  push:
    branches:
      - main
      - feature/m8-a-cli-token-streaming
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Format, check, and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Validate Python test runner syntax
        run: |
          python3 -m py_compile \
            scripts/api_test.py \
            scripts/api_load_test.py \
            scripts/cpu_kernel_cli_test.py \
            scripts/benchmark_kernels.py
          bash -n scripts/api-test.sh

      - name: Verify clean skip when API server is offline
        run: |
          bash scripts/api-test.sh --skip-build --base-url http://127.0.0.1:1
          python3 scripts/api_load_test.py --base-url http://127.0.0.1:1

      # Run build and tests before the repository-wide formatting gate.
      # Existing formatting debt should not hide compiler or test diagnostics.
      - name: Check workspace
        run: cargo check --workspace

      - name: Run tests
        run: cargo test --workspace

      - name: Validate retained CPU kernel CLI modes
        run: |
          cargo build -p qarnyx-cli
          python3 scripts/cpu_kernel_cli_test.py --bin target/debug/qarnyx

      - name: Check formatting
        run: cargo fmt --all -- --check
